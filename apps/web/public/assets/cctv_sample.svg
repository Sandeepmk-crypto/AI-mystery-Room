<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cctvGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1912"/>
      <stop offset="100%" stop-color="#020805"/>
    </linearGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#10b981" stroke-width="0.75" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background monitor -->
  <rect width="800" height="450" fill="url(#cctvGrad)"/>
  <rect width="800" height="450" fill="url(#scanlines)"/>

  <!-- Corridor walls in wireframe perspective -->
  <polygon points="0,0 260,150 260,300 0,450" fill="#04140c" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <polygon points="800,0 540,150 540,300 800,450" fill="#04140c" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  <rect x="260" y="150" width="280" height="150" fill="#020a06" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>

  <!-- Vault door outline -->
  <rect x="330" y="165" width="140" height="135" fill="#061f13" stroke="#34d399" stroke-width="2"/>
  <circle cx="430" cy="235" r="14" fill="#020805" stroke="#34d399" stroke-width="2"/>
  <circle cx="430" cy="235" r="4" fill="#10b981"/>

  <!-- Suspicious figure silhouette -->
  <path d="M385,270 Q375,230 395,205 Q400,190 405,190 Q410,190 415,205 Q435,230 425,270 Z" fill="#010402" opacity="0.95"/>
  <circle cx="405" cy="182" r="10" fill="#010402"/>

  <!-- Tactical pouch in hand -->
  <rect x="420" y="240" width="16" height="14" rx="2" fill="#0f2b1d" stroke="#34d399" stroke-width="1"/>

  <!-- Target box around figure -->
  <rect x="370" y="168" width="70" height="120" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="372" y="163" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">TARGET ID: 01 [MATCH]</text>

  <!-- OSD Overlays -->
  <text x="30" y="40" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold">REC ● [CAM-04 NORTH GALLERY HALLWAY]</text>
  <text x="30" y="65" fill="#34d399" font-family="monospace" font-size="13">2026-10-18  21:43:18  UTC+0</text>
  <text x="650" y="40" fill="#10b981" font-family="monospace" font-size="13">BATT: 94% [AUX]</text>
  <text x="635" y="65" fill="#ef4444" font-family="monospace" font-size="13">MOTION DETECTED</text>
  <text x="30" y="420" fill="#6ee7b7" font-family="monospace" font-size="12">MONOCHROMATIC NIGHT-VISION // EVIDENCE GRADE A</text>
</svg>
